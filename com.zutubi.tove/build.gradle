plugins {
    id 'java'
}

group = 'zutubi'
version = '2.7.0-dev'

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

sourceSets {
    main {
        java { srcDirs = ['src/java'] }
        resources {
            srcDirs = ['src/java']
            exclude '**/*.java'
        }
    }
    test {
        java { srcDirs = ['src/test'] }
        resources {
            srcDirs = ['src/test']
            exclude '**/*.java'
        }
    }
}

repositories {
    ivy {
        url = uri("${rootProject.projectDir}/repository")
        patternLayout {
            ivy '[organisation]/[module]/ivy-[revision].xml'
            artifact '[organisation]/[module]/jars/[artifact]-[revision].[ext]'
        }
        metadataSources { ivyDescriptor() }
    }
}

dependencies {
    implementation project(':com.zutubi.util')
    implementation project(':com.zutubi.i18n')
    implementation project(':com.zutubi.validation')
    implementation project(':com.zutubi.validation.annotations')
    implementation project(':com.zutubi.tove.annotations')
    implementation 'com.google:com.google.guava:18.0'
    implementation 'zutubi:events:3.0.2'
    implementation 'nu.xom:nu.xom:20111125'
    implementation 'org.springframework.security:org.springframework.security.core:3.0.5.RELEASE'
    implementation 'org.springframework.security:org.springframework.security.acls:3.0.5.RELEASE'
    implementation 'org.springframework:org.springframework.ldap:1.3.0.RELEASE'
    testImplementation project(path: ':com.zutubi.util', configuration: 'testOutput')
    testImplementation project(path: ':com.zutubi.validation', configuration: 'testOutput')
    testImplementation 'org.junit:org.junit:4.8.2'
    testImplementation 'org.mockito:org.mockito:1.5.0'
    testImplementation 'org.hamcrest:org.hamcrest:1.3'
}
