plugins {
    id 'java'
}

group = 'zutubi'
version = '2.7.0-dev'

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

sourceSets {
    main {
        java { srcDirs = ['src/java'] }
        resources {
            srcDirs = ['src/java']
            exclude '**/*.java'
        }
    }
    test {
        java {
            srcDirs = ['src/test']
            // AcegiLdapManagerTest requires ApacheDS 1.5.7 which is not available
            exclude '**/AcegiLdapManagerTest.java'
        }
        resources {
            srcDirs = ['src/test']
            exclude '**/*.java'
        }
    }
}

repositories {
    ivy {
        url = uri("${rootProject.projectDir}/repository")
        patternLayout {
            ivy '[organisation]/[module]/ivy-[revision].xml'
            artifact '[organisation]/[module]/jars/[artifact]-[revision].[ext]'
        }
        metadataSources { ivyDescriptor() }
    }
}

dependencies {
    implementation project(':com.zutubi.util')
    implementation project(':com.zutubi.i18n')
    implementation project(':com.zutubi.validation')
    implementation project(':com.zutubi.validation.annotations')
    implementation project(':com.zutubi.tove')
    implementation project(':com.zutubi.tove.annotations')
    implementation project(':com.zutubi.pulse.core')
    implementation project(':com.zutubi.pulse.servercore')
    implementation 'com.google:com.google.guava:18.0'
    implementation 'zutubi:boot:2.1'
    implementation 'zutubi:diff:3.0.3'
    implementation 'zutubi:events:3.0.2'
    implementation 'org.apache.xmlrpc:org.apache.xmlrpc:2.0.1'
    implementation 'com.caucho:com.caucho:3.0.13'
    implementation 'org.apache.commons:org.apache.commons.codec:1.3.0'
    implementation 'org.apache.commons:org.apache.commons.collections:3.2.0'
    implementation 'org.apache.commons:org.apache.commons.cli:1.0.0'
    implementation 'org.apache.commons:org.apache.commons.dbcp:1.3.0'
    implementation 'org.apache.commons:org.apache.commons.fileupload:1.2.2'
    implementation 'org.apache.commons:org.apache.commons.io:1.4.0'
    implementation 'org.apache.commons:org.apache.commons.lang:2.1.0'
    implementation 'org.apache.commons:org.apache.commons.pool:1.2.0'
    implementation 'org.apache.commons:org.apache.commons.httpclient:3.1.0'
    implementation 'org.apache.commons:org.apache.commons.vfs:20100409'
    implementation 'org.apache.ant:org.apache.ivy:2.0.0'
    implementation 'org.apache.velocity:org.apache.velocity:1.3.1'
    implementation 'org.apache.velocity:org.apache.velocity.tools.views:1.1.0'
    implementation 'net.sourceforge.ehcache:net.sf.ehcache:1.6.2'
    implementation 'org.hibernate:org.hibernate:3.3.1.GA'
    implementation 'org.slf4j:org.slf4j:1.5.3'
    implementation 'org.hsqldb:org.hsqldb:1.8.0.10'
    implementation 'org.igniterealtime:org.jivesoftware.smackx:2.2.1'
    implementation 'com.opensymphony.quartz:org.quartz:1.6.6'
    implementation 'com.opensymphony.sitemesh:com.opensymphony.sitemesh:2.2.1'
    implementation 'com.opensymphony.webwork:com.opensymphony.webwork:2.2.6'
    implementation 'com.opensymphony.xwork:com.opensymphony.xwork:1.2.3'
    implementation 'javax.mail:javax.mail:1.4.0'
    implementation 'javax.portlet:javax.portlet:2.0.0'
    implementation 'javax.servlet:javax.servlet:2.4.0'
    implementation 'javax.transaction:javax.transaction:1.1.0'
    implementation 'com.uwyn:com.uwyn.jhighlight:1.0.0'
    implementation 'org.springframework:org.springframework.aop:3.0.5.RELEASE'
    implementation 'org.springframework:org.springframework.beans:3.0.5.RELEASE'
    implementation 'org.springframework:org.springframework.context:3.0.5.RELEASE'
    implementation 'org.springframework:org.springframework.core:3.0.5.RELEASE'
    implementation 'org.springframework:org.springframework.expression:3.0.5.RELEASE'
    implementation 'org.springframework:org.springframework.jdbc:3.0.5.RELEASE'
    implementation 'org.springframework:org.springframework.orm:3.0.5.RELEASE'
    implementation 'org.springframework:org.springframework.transaction:3.0.5.RELEASE'
    implementation 'org.springframework:org.springframework.web:3.0.5.RELEASE'
    implementation 'org.springframework.security:org.springframework.security.acls:3.0.5.RELEASE'
    implementation 'org.springframework.security:org.springframework.security.core:3.0.5.RELEASE'
    implementation 'org.springframework.security:org.springframework.security.ldap:3.0.5.RELEASE'
    implementation 'org.springframework.security:org.springframework.security.web:3.0.5.RELEASE'
    implementation 'org.springframework.security:org.springframework.security.config:3.0.5.RELEASE'
    implementation 'org.springframework:org.springframework.ldap:1.3.0.RELEASE'
    implementation 'com.sun.syndication:com.sun.syndication:0.8.0'
    implementation 'com.sun.syndication:com.sun.syndication.content:20060508'
    implementation 'org.json:org.json:1.0.0'
    implementation 'net.sourceforge.flexjson:net.sf.flexjson:1.6.0'
    implementation 'org.jfree.chart:org.jfree.chart:1.0.13'
    implementation 'zutubi:jsdeps:0.2'
    implementation 'eclipse:equinox:3.3'
    implementation 'eclipse:equinox-bundles:3.3_2'
    implementation 'net.sourceforge.cglib:net.sf.cglib:2.1.3'
    implementation 'nu.xom:nu.xom:20111125'
    implementation 'org.mortbay.jetty:org.mortbay.jetty:5.1.15'
    testImplementation project(path: ':com.zutubi.util', configuration: 'testOutput')
    testImplementation project(path: ':com.zutubi.validation', configuration: 'testOutput')
    testImplementation project(path: ':com.zutubi.tove', configuration: 'testOutput')
    testImplementation project(path: ':com.zutubi.pulse.core', configuration: 'testOutput')
    testImplementation 'org.hamcrest:org.hamcrest:1.3'
    testImplementation 'org.junit:org.junit:4.8.2'
    testImplementation 'org.mockito:org.mockito:1.5.0'
}

test {
    // FreemarkerBuildResultRendererTest: also excluded from the Ant build
    // AgentSynchronisationServiceTest: Mockito 1.5.0 classloader isolation issue (same as RecipeCleanupTest)
    // DriverRegistryTest: deregisters all JDBC drivers in tearDown(); in Gradle's classloader
    //   model HSQLDB cannot re-auto-register, breaking subsequent DB tests in the same JVM
    exclude '**/FreemarkerBuildResultRendererTest*'
    exclude '**/AgentSynchronisationServiceTest*'
    exclude '**/DriverRegistryTest*'
}

// Expose test classes for use by other subprojects
task testJar(type: Jar, dependsOn: testClasses) {
    archiveClassifier = 'tests'
    from sourceSets.test.output
}

configurations {
    testOutput
}

artifacts {
    testOutput testJar
}
